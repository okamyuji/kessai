version: "2"
sql:
  - engine: "postgresql"
    queries: "db/queries"
    schema: "db/migrations"
    gen:
      go:
        package: "sqlc"
        out: "internal/platform/sqlc"
        sql_package: "pgx/v5"
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - column: "*.id"
            go_type: "string"
          - column: "*.transfer_id"
            go_type: "string"
          - column: "*.stripe_payment_intent_id"
            go_type:
              type: "string"
              pointer: true
