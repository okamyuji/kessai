name: CI
on:
  push:
    branches: [main]
  pull_request:

# GITHUB_TOKENの権限を最小に絞る（各jobで必要に応じて上書き）
permissions:
  contents: read

jobs:
  ci:
    permissions:
      contents: read
    uses: okamyuji/reusable-workflows/.github/workflows/go-ci.yml@v1
  security:
    permissions:
      contents: read
      pull-requests: write
    uses: okamyuji/reusable-workflows/.github/workflows/security-scan.yml@v1
